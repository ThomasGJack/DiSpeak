[package]
name = "dispeak-frontend"
version = "0.1.0"
description = "DiSpeak Frontend - Tauri + React"
authors = ["DiSpeak Team"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "window-unmaximize", "window-unminimize", "window-minimize", "window-hide", "window-show", "shell-open", "window-start-dragging", "window-maximize", "window-close", "http-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
