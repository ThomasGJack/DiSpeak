[package]
name = "dispeak-backend"
version = "0.1.0"
edition = "2021"
default-run = "dispeak-backend"

[[bin]]
name = "dispeak-backend"
path = "src/main.rs"

[[bin]]
name = "migrate-user-numbers"
path = "src/bin/migrate_user_numbers.rs"

[[bin]]
name = "create-admin"
path = "src/bin/create_admin.rs"

[[bin]]
name = "cleanup-offline-servers"
path = "src/bin/cleanup_offline_servers.rs"

[dependencies]
actix-web = "4"
actix-cors = "0.6"
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "sqlite", "migrate", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenv = "0.15"
bcrypt = "0.15"
jsonwebtoken = "9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"
reqwest = { version = "0.11", features = ["json"] }
thiserror = "1"
tracing-actix-web = "0.7"
dispeak-shared = { path = "../shared" }
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
rsa = { version = "0.9", features = ["pem"] }
